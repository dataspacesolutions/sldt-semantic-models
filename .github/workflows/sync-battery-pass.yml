name: Sync BatteryPass Models

on:
  schedule:
    - cron: '0 4 * * 1'   # Every Monday at 4 AM UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python dependencies
        run: pip install requests

      - name: Download TTL files from BatteryPass repo
        run: python .github/scripts/sync_battery_pass.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate artifacts for changed TTL files
        run: |
          if [ ! -s .battery_pass_changed_ttls ]; then
            echo "No TTL files changed — skipping generation."
            exit 0
          fi
          while IFS= read -r ttl_path; do
            [ -z "$ttl_path" ] && continue
            echo "Generating artifacts for: $ttl_path"
            ./generate.sh "$ttl_path"
          done < .battery_pass_changed_ttls

      - name: Commit and push if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add 'io.batterypass.*'
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync: update BatteryPass models from upstream"
            git push
          fi
