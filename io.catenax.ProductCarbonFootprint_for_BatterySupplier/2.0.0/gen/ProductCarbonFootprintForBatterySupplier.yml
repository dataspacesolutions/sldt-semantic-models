            \ Exchange (Version 2.0.0) from the WBCSD (World Business Council for\
            \ Sustainable Development)/ PACT initiative."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.pcf:7.0.0#secondaryEmissionFactorSources"
          $ref: "#/components/schemas/EmissionFactorDSSet"
        primaryDataShare:
          description: "Mandatory starting 2025: Share of primary data in percent\
            \ as specified in the Catena-X PCF Rulebook (Version 3.0.0) in accordance\
            \ with the technical specifications for PCF Data Exchange (Version 2.0.0)\
            \ from the WBCSD (World Business Council for Sustainable Development)/\
            \ PACT initiative."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.pcf:7.0.0#primaryDataShare"
          $ref: "#/components/schemas/PercentTrait"
        customerPartID:
          description: This is PartNumber assigend by the consumer
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#customerPartID"
          $ref: "#/components/schemas/PartIdCharacteristic"
        technologicalRepresentativeness:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#technologicalRepresentativeness"
          $ref: "#/components/schemas/DataQualityTrait"
        geographicalRepresentativeness:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#geographicalRepresentativeness"
          $ref: "#/components/schemas/DataQualityTrait"
        timerelatedRepresentativeness:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#timerelatedRepresentativeness"
          $ref: "#/components/schemas/DataQualityTrait"
        dataQualityRating:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#dataQualityRating"
          $ref: "#/components/schemas/DataQualityTrait"
        manufacturerPartId:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#manufacturerPartId"
          $ref: "#/components/schemas/PartIdCharacteristic"
        validityPeriod:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#validityPeriod"
          $ref: "#/components/schemas/CharacteristicValidityPeriod"
        siteBpn:
          description: Site BPN
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#siteBpn"
          $ref: "#/components/schemas/BpnsTrait"
        legalBpn:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#legalBpn"
          $ref: "#/components/schemas/BpnlTrait"
        productQualityParameter:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#productQualityParameter"
          $ref: "#/components/schemas/StringArray"
        contentC02Metals:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#contentC02Metals"
          $ref: "#/components/schemas/StringArray"
      required:
      - cxPCFValues
      - customerPartID
      - technologicalRepresentativeness
      - geographicalRepresentativeness
      - timerelatedRepresentativeness
      - dataQualityRating
      - validityPeriod
      - siteBpn
      - legalBpn
  responses:
    Unauthorized:
      description: The requesting user or client is not authenticated.
    Forbidden:
      description: The requesting user or client is not authorized to access resources.
