          $ref: "#/components/schemas/ResourcePath"
      required:
      - sharesPerStage
    EmissionFactorDS:
      description: Entity for defining an emission factor data source used to calculate
        a product carbon footprint as specified in the Catena-X PCF Rulebook (Version
        3.0.0) in accordance with the technical specifications for PCF Data Exchange
        (Version 2.0.0) from the WBCSD (World Business Council for Sustainable Development)/
        PACT initiative.
      x-samm-aspect-model-urn: "urn:samm:io.catenax.pcf:7.0.0#EmissionFactorDS"
      type: object
      properties:
        secondaryEmissionFactorSource:
          description: "Mandatory: Emission factor data source used to calculate a\
            \ product carbon footprint as specified in the Catena-X PCF Rulebook (Version\
            \ 3.0.0) in accordance with the technical specifications for PCF Data\
            \ Exchange (Version 2.0.0) from the WBCSD (World Business Council for\
            \ Sustainable Development)/ PACT initiative."
