---
openapi: 3.0.3
info:
  title: ProductCarbonFootprintForBatterySupplier
  version: v2
  x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#ProductCarbonFootprintForBatterySupplier"
servers:
- url: catenax.io/api/v2
