      type: object
      properties:
        stage1RawMaterialAquisitionPreProcessing:
          description: This attribute describes the percentage of the absolute PCF
            value of this component that is attributable to the 'Raw material and
            preprocessing' stage.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#stage1RawMaterialAquisitionPreProcessing"
          $ref: "#/components/schemas/CharacteristicStage"
        stage2MainProductProduction:
          description: This attribute describes the percentage of the absolute PCF
            value of this component that is attributable to the 'Raw material and
            preprocessing' stage.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#stage2MainProductProduction"
          $ref: "#/components/schemas/CharacteristicStage"
        stage3Distribution:
          description: This attribute describes the percentage of the absolute PCF
            value of this component that is attributable to the 'Raw material and
            preprocessing' stage.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#stage3Distribution"
          $ref: "#/components/schemas/CharacteristicStage"
        stage4EndOfLifeRecycling:
          description: This attribute describes the percentage of the absolute PCF
            value of this component that is attributable to the 'Raw material and
            preprocessing' stage.
