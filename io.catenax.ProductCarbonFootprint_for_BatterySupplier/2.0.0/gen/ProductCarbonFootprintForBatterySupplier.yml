      - secondaryEmissionFactorSource
    EmissionFactorDSSet:
      description: Characteristic for defining a set of emission factor sources used
        for calculating a product carbon footprint as specified in the Catena-X PCF
        Rulebook (Version 3.0.0) in accordance with the technical specifications for
        PCF Data Exchange (Version 2.0.0) from the WBCSD (World Business Council for
        Sustainable Development)/ PACT initiative.
      x-samm-aspect-model-urn: "urn:samm:io.catenax.pcf:7.0.0#EmissionFactorDSSet"
      type: array
      items:
        $ref: "#/components/schemas/EmissionFactorDS"
      uniqueItems: true
    PercentTrait:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.catenax.pcf:7.0.0#PercentTrait"
      description: Constraint for a decimal number in the range of and including 0
        and 100.
      maximum: 100.0
      exclusiveMaximum: false
      minimum: 0.0
      exclusiveMinimum: false
    PartIdCharacteristic:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.catenax.serial_part:3.0.0#PartIdCharacteristic"
      description: "The part ID is a multi-character string, usually assigned by an\
        \ ERP system"
    DataQualityTrait:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#DataQualityTrait"
      maximum: 5
      exclusiveMaximum: false
      minimum: 1
      exclusiveMinimum: false
    Timestamp:
      type: string
      pattern: "-?([1-9][0-9]{3,}|0[0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T(([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\\\
        .[0-9]+)?|(24:00:00(\\.0+)?))(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?"
      x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#Timestamp"
      description: Describes a Property which contains the date and time with an optional
        timezone.
    CharacteristicValidityPeriod:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#CharacteristicValidityPeriod"
      type: object
      properties:
        validityPeriodStart:
          description: Start of the Validity Period of the provided PCF Values ISO-8601
            / RFC3339 Timestamp
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#validityPeriodStart"
          $ref: "#/components/schemas/Timestamp"
        validityPeriodEnd:
          description: End of the validity Period of the provided pcf Values . ISO-8601/RFC-3339
            timestamp
          x-samm-aspect-model-urn: "urn:samm:io.catenax.ProductCarbonFootprint_for_BatterySupplier:2.0.0#validityPeriodEnd"
          $ref: "#/components/schemas/Timestamp"
      required:
      - validityPeriodStart
      - validityPeriodEnd
    BpnsTrait:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.business_partner_number:2.0.0#BpnsTrait"
      description: "The provided regular expression ensures that the BPNS is composed\
        \ of prefix 'BPNS', 10 digits and two alphanumeric letters."
      pattern: "^BPNS[a-zA-Z0-9]{12}$"
    BpnlTrait:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.business_partner_number:2.0.0#BpnlTrait"
      description: "The provided regular expression ensures that the BPNL is composed\
        \ of prefix 'BPNL', 10 digits and two alphanumeric letters."
      pattern: "^BPNL[a-zA-Z0-9]{12}$"
    StringArray:
